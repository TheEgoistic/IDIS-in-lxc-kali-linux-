<!DOCTYPE html>
<html>
<head>
    <title>LUX HUNT Store</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background:#eaeded; }

        /* NAVBAR */
        .navbar {
            background-color: #131921;
        }

        .navbar-brand {
            color: #ff9900 !important;
            font-weight: bold;
        }

        .search-box {
            width: 50%;
        }

        .cart {
            color: white;
            font-weight: bold;
        }

        /* PRODUCT CARD */
        .product-card {
            transition: 0.2s;
            border: none;
        }

        .product-card:hover {
            transform: scale(1.03);
        }

        .price {
            color: #B12704;
            font-weight: bold;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg px-3">

    <a class="navbar-brand" href="/">LUX HUNT Store</a>

    <input type="text" id="searchInput" class="form-control search-box mx-3"
           placeholder="Search products...">

    <a href="/login" class="btn btn-warning mx-2">Login</a>

    <div class="cart">
        🛒 Cart (<span id="cartCount">0</span>)
    </div>
</nav>

<!-- PRODUCTS -->
<div class="container mt-4">

    <div class="row" id="productList">

        <div class="col-md-4 product-item">
            <div class="card product-card p-3">
                <h5>Laptop</h5>
                <p class="price">₹50,000</p>
                <button class="btn btn-warning" onclick="addCart()">Add to Cart</button>
            </div>
        </div>

        <div class="col-md-4 product-item">
            <div class="card product-card p-3">
                <h5>Smartphone</h5>
                <p class="price">₹20,000</p>
                <button class="btn btn-warning" onclick="addCart()">Add to Cart</button>
            </div>
        </div>

        <div class="col-md-4 product-item">
            <div class="card product-card p-3">
                <h5>Headphones</h5>
                <p class="price">₹2,000</p>
                <button class="btn btn-warning" onclick="addCart()">Add to Cart</button>
            </div>
        </div>

        <div class="col-md-4 product-item">
            <div class="card product-card p-3">
                <h5>Smart Watch</h5>
                <p class="price">₹5,000</p>
                <button class="btn btn-warning" onclick="addCart()">Add to Cart</button>
            </div>
        </div>

    </div>
</div>

<script>
let cart = 0;

// CART FUNCTION
function addCart() {
    cart++;
    document.getElementById("cartCount").innerText = cart;
}

// SEARCH FILTER
document.getElementById("searchInput").addEventListener("keyup", function () {
    let value = this.value.toLowerCase();
    let items = document.getElementsByClassName("product-item");

    for (let i = 0; i < items.length; i++) {
        let product = items[i].innerText.toLowerCase();
        items[i].style.display = product.includes(value) ? "block" : "none";
    }
});
</script>

</body>
</html>
